# These files are intentionally vulnerable teaching examples for Week 15.
# Keep the allowlist narrow; all other repository content remains scanned.
[[allowlists]]
description = "Week 15 teaching examples"
paths = [
  '''(^|/)insecure_service\.py$''',
  '''(^|/)sample-service\.py$''',
  '''(^|/)secure_service\.py$''',
  '''(^|/)worksheet\.md$''',
  '''(^|/)README.*\.md$'''
]

[[rules]]
id = "week15-training-token"
description = "Week 15 training token"
regex = '''TRAINING_TOKEN\s*=\s*([A-Za-z0-9_-]{20,})'''
secretGroup = 1
keywords = ["TRAINING_TOKEN"]
